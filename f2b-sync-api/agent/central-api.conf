# fail2ban action to report bans/unbans to the central f2b-sync-api collector
#
# Install:
#   cp central-api.conf /etc/fail2ban/action.d/central-api.conf
#
# In your jail config, add:
#   action = central-api[server_id="<hostname>", jail="<name>"]

[Definition]

actionban   = /usr/local/bin/f2b-central-report.sh ban   <ip> <name> <server_id>
actionunban = /usr/local/bin/f2b-central-report.sh unban <ip> <name> <server_id>
actionstart =
actionstop  =

[Init]

server_id = unknown
