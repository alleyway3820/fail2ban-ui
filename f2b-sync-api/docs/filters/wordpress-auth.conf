[INCLUDES]
before = common.conf

[Definition]
# Detect failed WordPress logins from OLS access logs (Combined Log Format)
# A 200 response to POST /wp-login.php means WP re-rendered the form = failure
# A 302 with small body would be a success (redirect to dashboard)
failregex = ^<HOST> .+ "POST /wp-login\.php HTTP/\d\.\d" (?:200|302|403) .+$
            ^<HOST> .+ "POST /xmlrpc\.php HTTP/\d\.\d" (?:200|403|500) .+$
            ^<HOST> .+ "GET /wp-login\.php\?action=register HTTP/\d\.\d" 200 .+$

ignoreregex = ^<HOST> .+ "POST /wp-login\.php HTTP/\d\.\d" 301 .+$
