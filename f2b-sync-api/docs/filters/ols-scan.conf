[INCLUDES]
before = common.conf

[Definition]
# Detect scanner/probe activity (404 storms, exploit path hits)
failregex = ^<HOST> .+ "(?:GET|POST|HEAD) /.+(?:\.php|\.asp|\.env|\.git|admin|phpmyadmin|setup|install|eval|base64).* HTTP/\d\.\d" 404 .+$
            ^<HOST> .+ "(?:GET|POST) /(?:wp-admin/install\.php|wp-config\.php|\.htaccess|etc/passwd) HTTP/\d\.\d" \d+ .+$

ignoreregex =
