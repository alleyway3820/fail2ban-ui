<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>f2b-sync — Whitelist</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    body { background: #0d1117; }
    .navbar-brand { font-weight: 700; color: #58a6ff !important; }
    #toast-container { position: fixed; bottom: 1rem; right: 1rem; z-index: 9999; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/dashboard"><i class="bi bi-shield-fill-exclamation"></i> f2b-sync</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/geo-countries">Geo-Block</a></li>
        <li class="nav-item"><a class="nav-link" href="/servers">Servers</a></li>
        <li class="nav-item"><a class="nav-link active" href="/whitelist">Whitelist</a></li>
      </ul>
      <button class="btn btn-outline-secondary btn-sm" id="logout-btn">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>
    </div>
  </div>
</nav>

<div class="container py-4">
  <h4 class="mb-4">IP Whitelist</h4>

  <!-- Add form -->
  <div class="card border-secondary mb-4">
    <div class="card-header">Add IP to Whitelist</div>
    <div class="card-body">
      <form id="add-form" class="row g-2">
        <div class="col-md-4">
          <input type="text" class="form-control" id="ip-input" placeholder="IP address (e.g. 1.2.3.4)" required />
        </div>
        <div class="col-md-5">
          <input type="text" class="form-control" id="reason-input" placeholder="Reason (optional)" />
        </div>
        <div class="col-md-3">
          <button type="submit" class="btn btn-primary w-100">Add to Whitelist</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Table -->
  <div class="table-responsive">
    <table class="table table-dark table-hover table-sm">
      <thead class="table-secondary">
        <tr>
          <th>IP Address</th>
          <th>Reason</th>
          <th>Added</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="whitelist-tbody">
        <tr><td colspan="4" class="text-center text-muted">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div id="toast-container"></div>
<script src="/static/app.js"></script>
<script>
  requireAuth();

  async function loadWhitelist() {
    const tbody = document.getElementById('whitelist-tbody');
    try {
      const data = await apiGet('/api/v1/whitelist');
      const entries = data.whitelist ?? [];
      if (entries.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Whitelist is empty</td></tr>';
        return;
      }
      tbody.innerHTML = entries.map(e => `
        <tr>
          <td><code>${esc(e.ip_address)}</code></td>
          <td>${esc(e.reason || '—')}</td>
          <td><small>${e.created_at ? new Date(e.created_at).toLocaleString() : '—'}</small></td>
          <td>
            <button class="btn btn-danger btn-sm" onclick="removeIP('${esc(e.ip_address)}')">
              <i class="bi bi-trash"></i> Remove
            </button>
          </td>
        </tr>
      `).join('');
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="4" class="text-danger">${esc(e.message)}</td></tr>`;
    }
  }

  async function removeIP(ip) {
    if (!confirm(`Remove ${ip} from whitelist?`)) return;
    try {
      await apiDelete(`/api/v1/whitelist/${encodeURIComponent(ip)}`);
      showToast(`Removed ${ip} from whitelist`, 'success');
      loadWhitelist();
    } catch (e) {
      showToast(e.message, 'danger');
    }
  }

  document.getElementById('add-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const ip = document.getElementById('ip-input').value.trim();
    const reason = document.getElementById('reason-input').value.trim();
    try {
      await apiPost('/api/v1/whitelist', { ip, reason: reason || null });
      showToast(`Added ${ip} to whitelist`, 'success');
      e.target.reset();
      loadWhitelist();
    } catch (err) {
      showToast(err.message, 'danger');
    }
  });

  document.getElementById('logout-btn').addEventListener('click', logout);
  loadWhitelist();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
