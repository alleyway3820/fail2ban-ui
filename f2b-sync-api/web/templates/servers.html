<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>f2b-sync — Servers</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    body { background: #0d1117; }
    .navbar-brand { font-weight: 700; color: #58a6ff !important; }
    #toast-container { position: fixed; bottom: 1rem; right: 1rem; z-index: 9999; }
    .api-key-display { font-family: monospace; word-break: break-all; background: #1c2128; padding: 0.5rem; border-radius: 4px; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/dashboard"><i class="bi bi-shield-fill-exclamation"></i> f2b-sync</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/geo-countries">Geo-Block</a></li>
        <li class="nav-item"><a class="nav-link active" href="/servers">Servers</a></li>
        <li class="nav-item"><a class="nav-link" href="/whitelist">Whitelist</a></li>
      </ul>
      <button class="btn btn-outline-secondary btn-sm" id="logout-btn">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>
    </div>
  </div>
</nav>

<div class="container py-4">
  <h4 class="mb-4">Registered Servers</h4>

  <!-- New key alert (shown once after creation) -->
  <div id="new-key-alert" class="alert alert-warning d-none" role="alert">
    <strong>API Key (shown once — copy it now):</strong>
    <div class="api-key-display mt-2" id="new-key-value"></div>
    <button class="btn btn-sm btn-outline-light mt-2" id="copy-key-btn">
      <i class="bi bi-clipboard"></i> Copy
    </button>
  </div>

  <!-- Add form -->
  <div class="card border-secondary mb-4">
    <div class="card-header">Add Server</div>
    <div class="card-body">
      <form id="add-form" class="row g-2">
        <div class="col-md-6">
          <input type="text" class="form-control" id="server-name" placeholder="Server name (e.g. web-01)" required />
        </div>
        <div class="col-md-3">
          <button type="submit" class="btn btn-primary w-100">Generate API Key</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Table -->
  <div class="table-responsive">
    <table class="table table-dark table-hover table-sm">
      <thead class="table-secondary">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Status</th>
          <th>Last Seen</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="servers-tbody">
        <tr><td colspan="6" class="text-center text-muted">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div id="toast-container"></div>
<script src="/static/app.js"></script>
<script>
  requireAuth();

  async function loadServers() {
    const tbody = document.getElementById('servers-tbody');
    try {
      const data = await apiGet('/api/v1/servers');
      const servers = data.servers ?? [];
      if (servers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No servers registered</td></tr>';
        return;
      }
      tbody.innerHTML = servers.map(s => `
        <tr class="${s.is_active ? '' : 'opacity-50'}">
          <td>${s.id}</td>
          <td>${esc(s.server_name)}</td>
          <td>
            <span class="badge ${s.is_active ? 'bg-success' : 'bg-danger'}">
              ${s.is_active ? 'Active' : 'Revoked'}
            </span>
          </td>
          <td><small>${s.last_seen ? new Date(s.last_seen).toLocaleString() : 'Never'}</small></td>
          <td><small>${s.created_at ? new Date(s.created_at).toLocaleDateString() : '—'}</small></td>
          <td>
            ${s.is_active ? `<button class="btn btn-danger btn-sm" onclick="revokeServer(${s.id}, '${esc(s.server_name)}')">
              <i class="bi bi-x-circle"></i> Revoke
            </button>` : ''}
          </td>
        </tr>
      `).join('');
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-danger">${esc(e.message)}</td></tr>`;
    }
  }

  async function revokeServer(id, name) {
    if (!confirm(`Revoke API key for "${name}"? The server will lose access immediately.`)) return;
    try {
      await apiDelete(`/api/v1/servers/${id}`);
      showToast(`Revoked: ${name}`, 'warning');
      loadServers();
    } catch (e) {
      showToast(e.message, 'danger');
    }
  }

  document.getElementById('add-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const serverName = document.getElementById('server-name').value.trim();
    try {
      const data = await apiPost('/api/v1/servers', { server_name: serverName });
      document.getElementById('new-key-value').textContent = data.api_key;
      document.getElementById('new-key-alert').classList.remove('d-none');
      e.target.reset();
      loadServers();
    } catch (err) {
      showToast(err.message, 'danger');
    }
  });

  document.getElementById('copy-key-btn').addEventListener('click', () => {
    const key = document.getElementById('new-key-value').textContent;
    navigator.clipboard.writeText(key).then(() => showToast('Copied to clipboard', 'success'));
  });

  document.getElementById('logout-btn').addEventListener('click', logout);
  loadServers();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
