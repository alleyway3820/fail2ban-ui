<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>f2b-sync — Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    body { background: #0d1117; }
    .navbar-brand { font-weight: 700; color: #58a6ff !important; }
    .stat-card { background: #161b22; border: 1px solid #30363d; }
    .stat-card .display-6 { color: #58a6ff; }
    #toast-container { position: fixed; bottom: 1rem; right: 1rem; z-index: 9999; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/dashboard"><i class="bi bi-shield-fill-exclamation"></i> f2b-sync</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="/dashboard">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/geo-countries">Geo-Block</a></li>
        <li class="nav-item"><a class="nav-link" href="/servers">Servers</a></li>
        <li class="nav-item"><a class="nav-link" href="/whitelist">Whitelist</a></li>
      </ul>
      <button class="btn btn-outline-secondary btn-sm" id="logout-btn">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>
    </div>
  </div>
</nav>

<div class="container-fluid py-4 px-4">

  <!-- Stats row -->
  <div class="row g-3 mb-4">
    <div class="col-sm-4">
      <div class="card stat-card text-center p-3">
        <div class="text-muted small">Total Bans</div>
        <div class="display-6" id="stat-total">—</div>
      </div>
    </div>
    <div class="col-sm-4">
      <div class="card stat-card text-center p-3">
        <div class="text-muted small">Active in Blocklist</div>
        <div class="display-6" id="stat-active">—</div>
      </div>
    </div>
    <div class="col-sm-4">
      <div class="card stat-card text-center p-3">
        <div class="text-muted small">Servers Connected</div>
        <div class="display-6" id="stat-servers">—</div>
      </div>
    </div>
  </div>

  <!-- Search -->
  <div class="row mb-3">
    <div class="col-md-6">
      <input type="text" class="form-control" id="search-input" placeholder="Search IP, jail, or hostname…" />
    </div>
    <div class="col-md-3">
      <input type="text" class="form-control" id="server-filter" placeholder="Filter by server ID…" />
    </div>
    <div class="col-md-3">
      <button class="btn btn-secondary w-100" id="search-btn">
        <i class="bi bi-search"></i> Search
      </button>
    </div>
  </div>

  <!-- Ban table -->
  <div class="table-responsive">
    <table class="table table-dark table-hover table-sm align-middle">
      <thead class="table-secondary">
        <tr>
          <th>IP</th>
          <th>Jail</th>
          <th>Server</th>
          <th>Country</th>
          <th>Time</th>
          <th>Source</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="bans-tbody">
        <tr><td colspan="7" class="text-center text-muted">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="d-flex justify-content-between align-items-center mt-2">
    <small class="text-muted" id="pagination-info"></small>
    <div>
      <button class="btn btn-outline-secondary btn-sm me-1" id="prev-btn" disabled>
        <i class="bi bi-chevron-left"></i> Prev
      </button>
      <button class="btn btn-outline-secondary btn-sm" id="next-btn" disabled>
        Next <i class="bi bi-chevron-right"></i>
      </button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="/static/app.js"></script>
<script>
  requireAuth();

  const LIMIT = 50;
  let offset = 0;
  let totalRows = 0;

  async function loadStats() {
    try {
      const data = await apiGet('/api/v1/stats');
      document.getElementById('stat-total').textContent = data.total_bans ?? '—';
      document.getElementById('stat-active').textContent = data.active_bans ?? '—';
      document.getElementById('stat-servers').textContent = data.servers_count ?? '—';
    } catch (e) {
      console.warn('stats error', e);
    }
  }

  async function loadBans() {
    const search = document.getElementById('search-input').value.trim();
    const serverId = document.getElementById('server-filter').value.trim();
    const params = new URLSearchParams({ limit: LIMIT, offset });
    if (search) params.set('search', search);
    if (serverId) params.set('server_id', serverId);

    const tbody = document.getElementById('bans-tbody');
    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">Loading…</td></tr>';

    try {
      const data = await apiGet(`/api/v1/bans?${params}`);
      totalRows = data.total ?? 0;
      const bans = data.bans ?? [];

      if (bans.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No results</td></tr>';
        return;
      }

      tbody.innerHTML = bans.map(b => `
        <tr>
          <td><code>${esc(b.ip)}</code></td>
          <td>${esc(b.jail || '—')}</td>
          <td>${esc(b.server_id || '—')}</td>
          <td>${esc(b.country || '—')}</td>
          <td><small>${b.banned_at ? new Date(b.banned_at).toLocaleString() : '—'}</small></td>
          <td><span class="badge ${b.source === 'sync-api' ? 'bg-primary' : 'bg-secondary'}">${esc(b.source || '')}</span></td>
          <td>
            <button class="btn btn-danger btn-sm" onclick="doUnban('${esc(b.ip)}', '${esc(b.jail || '')}', '${esc(b.server_id || '')}')">
              Unban
            </button>
          </td>
        </tr>
      `).join('');

      document.getElementById('pagination-info').textContent =
        `Showing ${offset + 1}–${Math.min(offset + bans.length, totalRows)} of ${totalRows}`;
      document.getElementById('prev-btn').disabled = offset === 0;
      document.getElementById('next-btn').disabled = offset + LIMIT >= totalRows;
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="7" class="text-danger">${esc(e.message)}</td></tr>`;
    }
  }

  async function doUnban(ip, jail, serverId) {
    if (!confirm(`Unban ${ip}?`)) return;
    try {
      await apiPost('/api/v1/unban', { ip, jail, server_id: serverId });
      showToast(`Unbanned ${ip}`, 'success');
      loadBans();
    } catch (e) {
      showToast(`Error: ${e.message}`, 'danger');
    }
  }

  document.getElementById('search-btn').addEventListener('click', () => { offset = 0; loadBans(); });
  document.getElementById('search-input').addEventListener('keydown', e => { if (e.key === 'Enter') { offset = 0; loadBans(); } });
  document.getElementById('prev-btn').addEventListener('click', () => { offset = Math.max(0, offset - LIMIT); loadBans(); });
  document.getElementById('next-btn').addEventListener('click', () => { offset += LIMIT; loadBans(); });
  document.getElementById('logout-btn').addEventListener('click', logout);

  loadStats();
  loadBans();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
